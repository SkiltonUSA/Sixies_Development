"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "./scripts/setup-porting-workspace.sh"
run_mode = "concurrent"

[scripts.run.test-porting]
command = "make test-porting"
icon = "test-tube"

[scripts.run.build-c64]
command = "make"
icon = "hammer"

[scripts.run.run-c64]
command = "make run"
available_in = [ "local" ]
icon = "play"
