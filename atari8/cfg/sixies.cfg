FEATURES {
    STARTADDRESS: default = $2000;
}

SYMBOLS {
    __STARTADDRESS__: type = export, value = %S;
}

MEMORY {
    ZP:     file = "", define = yes, start = $0082, size = $007E;
    MAIN:   file = %O, define = yes, start = %S,    size = $8000 - %S;
    # $8000-$9EFF is screen RAM; $A000-$BFFF is free on XL/XE with BASIC off
    # (-nobasic) and hosts the SID2SAPR player, compressed stream, and buffers.
    HIRAM:  file = %O, define = yes, start = $A000, size = $2000;
}

FILES {
    %O: format = atari;
}

FORMATS {
    atari: runad = start;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp,  optional = yes;
    CODE:     load = MAIN,   type = ro,  define = yes;
    DLIST:    load = MAIN,   type = ro,  align = $400;
    RODATA:   load = MAIN,   type = ro,  optional = yes;
    AUXCODE:  load = HIRAM,  type = ro,  optional = yes;
    DATA:     load = MAIN,   type = rw,  optional = yes;
    BSS:      load = MAIN,   type = bss, optional = yes, define = yes;
    MUSICCODE: load = HIRAM, type = ro,  optional = yes;
    MUSIC:    load = HIRAM,  type = ro,  optional = yes;
    MUSICBSS: load = HIRAM,  type = bss, optional = yes, align = $100;
}
